<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>MergeTip — Non-Custodial Bitcoin Tips for GitHub Work</title>
		<meta
			name="description"
			content="Tip open-source contributors in sats, straight from GitHub, for verified work. Non-custodial payments over Nostr Wallet Connect (NWC) and Lightning Address."
		/>
		<script>
			// Prevent flash of wrong theme
			(function () {
				try {
					var stored = localStorage.getItem('mergetip-theme');
					var prefDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme = stored ? stored : prefDark ? 'dark' : 'light';
					document.documentElement.dataset.theme = theme;
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
