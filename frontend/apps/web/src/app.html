<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Tip open-source contributors in sats, straight from GitHub, for verified work. Non-custodial: you pay from your own wallet."
		/>
		<script nonce="%sveltekit.nonce%">
			// Apply a saved theme choice before first paint; otherwise the OS preference applies.
			try {
				const theme = localStorage.getItem('mergetip-theme');
				if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="contents">%sveltekit.body%</div>
	</body>
</html>
